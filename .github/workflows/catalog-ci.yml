name: catalog-ci

on:
  pull_request:
    paths:
      - 'services/catalog-service/**'
      - 'shared/**'
      - 'Directory.*.props'
      - 'global.json'
      - '.github/workflows/catalog-ci.yml'
  push:
    branches: [main, tier-5-microservices]
    paths:
      - 'services/catalog-service/**'
      - 'shared/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore services/catalog-service/Catalog.sln
      - run: dotnet build services/catalog-service/Catalog.sln --no-restore -c Release
      - run: dotnet test services/catalog-service/Catalog.sln --no-build -c Release --logger trx

  image-api:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/catalog-service/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/catalog-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/catalog-api:latest

  image-worker:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/catalog-service/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/catalog-worker:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/catalog-worker:latest
