name: ci

on:
  push:
    branches: [main, tier-3-modular-monolith]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (Release, warnings-as-errors)
        run: dotnet build --configuration Release --no-restore

      - name: Unit tests (no Docker)
        run: |
          dotnet test tests/Platform.UnitTests/Platform.UnitTests.csproj --configuration Release --no-build
          dotnet test tests/Catalog.UnitTests/Catalog.UnitTests.csproj --configuration Release --no-build
          dotnet test tests/Orders.UnitTests/Orders.UnitTests.csproj --configuration Release --no-build
          dotnet test tests/ArchitectureTests/ArchitectureTests.csproj --configuration Release --no-build

      - name: Integration + E2E tests (Testcontainers postgres)
        run: |
          dotnet test tests/Platform.IntegrationTests/Platform.IntegrationTests.csproj --configuration Release --no-build
          dotnet test tests/Catalog.IntegrationTests/Catalog.IntegrationTests.csproj --configuration Release --no-build
          dotnet test tests/Orders.IntegrationTests/Orders.IntegrationTests.csproj --configuration Release --no-build
          dotnet test tests/EndToEndTests/EndToEndTests.csproj --configuration Release --no-build

  migration-scripts:
    name: Generate migration scripts per module
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.0

      - name: Restore
        run: dotnet restore

      - name: Generate idempotent migration scripts
        run: |
          mkdir -p migration-artifacts
          dotnet ef migrations script --idempotent \
            --project src/Modules/Platform \
            --startup-project src/Hosts/Api \
            --context PlatformDbContext \
            --output migration-artifacts/platform.sql
          dotnet ef migrations script --idempotent \
            --project src/Modules/Catalog \
            --startup-project src/Hosts/Api \
            --context CatalogDbContext \
            --output migration-artifacts/catalog.sql
          dotnet ef migrations script --idempotent \
            --project src/Modules/Orders \
            --startup-project src/Hosts/Api \
            --context OrdersDbContext \
            --output migration-artifacts/orders.sql

      - name: Upload migration scripts
        uses: actions/upload-artifact@v4
        with:
          name: migration-scripts
          path: migration-artifacts/*.sql
          retention-days: 30
