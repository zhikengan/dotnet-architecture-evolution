name: gateways-ci

on:
  pull_request:
    paths:
      - 'gateways/**'
      - 'shared/**'
      - 'Directory.*.props'
      - 'global.json'
  push:
    branches: [main, tier-5-microservices]
    paths:
      - 'gateways/**'
      - 'shared/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet build gateways/buyer-bff/BuyerBff.csproj -c Release
      - run: dotnet build gateways/seller-bff/SellerBff.csproj -c Release
      - run: dotnet build gateways/admin-bff/AdminBff.csproj -c Release

  images:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        bff: [buyer-bff, seller-bff, admin-bff]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: gateways/${{ matrix.bff }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.bff }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.bff }}:latest
