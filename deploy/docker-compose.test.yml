services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketplace_test
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace_test"]
      interval: 5s
      timeout: 5s
      retries: 10
