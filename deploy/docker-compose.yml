services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports: ["5000:8080"]
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/marketplace.db
    volumes:
      - marketplace-data:/app/data
volumes:
  marketplace-data:
