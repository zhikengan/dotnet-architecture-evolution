services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/product-images --ignore-existing;
      mc anonymous set download local/product-images;
      "

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    ports: ["5000:8080"]
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Marketplace: Host=postgres;Database=marketplace;Username=marketplace;Password=marketplace
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: marketplace-api
      # MinIO storage (inside the compose network)
      Storage__Provider: S3
      Storage__Endpoint: http://minio:9000
      # Browser-facing URL for the presigned PUT — different from the in-network endpoint.
      Storage__PublicEndpoint: http://localhost:9000
      Storage__AccessKey: minioadmin
      Storage__SecretKey: minioadmin
      Storage__Bucket: product-images
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      jaeger: { condition: service_started }

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    ports: ["5001:8080"]  # /hangfire dashboard
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Marketplace: Host=postgres;Database=marketplace;Username=marketplace;Password=marketplace
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: marketplace-worker
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_started }
      jaeger: { condition: service_started }

volumes:
  pgdata:
  miniodata:
